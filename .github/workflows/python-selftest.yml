name: Python self-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run serial_logger self-test
        run: python OffgasMonitor/serial_logger.py --selftest
