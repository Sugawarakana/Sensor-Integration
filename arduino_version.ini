[arduino]
board_package = STM32 MCU based boards by STMicroelectronics
board_target = Nucleo G431KB
platform = STMicroelectronics:stm32
core_version = 2.11.0

[libraries]
ACANFD_STM32 = 1.1.2-rc1
ACAN2515 = 2.1.5
arduino-i2c-sen66 = latest
MICS-VZ-89TE = latest

[notes]
# Pin the STM32duino core version to the exact version installed in your local Arduino environment.
# The library versions listed here match the versions documented in the project README.
# Update this file whenever the firmware is validated against a new Arduino or library version.
